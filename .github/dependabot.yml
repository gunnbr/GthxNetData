# Monthly update PRs, one per ecosystem, so updates arrive in a few batched PRs instead of one PR per package.
# (Security updates still arrive as soon as an advisory is published.) GthxNetBot uses this repo as a
# submodule and references some of the same packages (EF Core), so keep the versions in step there.
version: 2
updates:
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: monthly
    groups:
      nuget:
        patterns: ["*"]

  # Keeps the SHA-pinned actions in .github/workflows up to date.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]

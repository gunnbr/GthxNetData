# Builds the solution on every pull request, so Dependabot's update PRs show whether they still build.
# The tests for this code live in GthxNetBot (Gthx.Test), which runs them against SQL Server.
name: CI

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'

      - name: Build
        run: dotnet build Gthx.Data.sln --configuration Release
